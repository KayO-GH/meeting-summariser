<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceToText</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <header>
    <div class="logo">Voice<span>ToText</span></div>
    <div class="header-right">
      <div class="status-pill hidden" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Idle</span>
      </div>
      <div class="account-pill hidden" id="accountPill">
        <span id="accountEmail"></span>
        <span class="credit-badge" id="creditBadge"></span>
      </div>
    </div>
  </header>
  <main>
    <div id="appSection">
      <div class="card" id="recordCard">
        <div class="card-label">Record your voice</div>
        <p class="hint">Click <strong>Start recording</strong> and speak. Your words will appear below as you talk.</p>
        <div class="button-row" style="margin-top: 1rem;">
          <button class="btn-primary" id="recordBtn" onclick="toggleRecording()">
            <span class="mic-icon">🎙</span> Start recording
          </button>
          <button class="btn-secondary" id="clearBtn" onclick="clearAll()" disabled>Clear</button>
        </div>
      </div>
      <div class="card" id="transcriptCard">
        <div class="card-label">Transcript</div>
        <div class="transcript-box" id="transcriptBox">
          <span class="placeholder">Your transcript will appear here as you speak...</span>
        </div>
        <div style="margin-top: 1rem;">
          <button class="btn-primary" id="summariseBtn" onclick="requestSummary()" disabled>
            ✦ Summarise
          </button>
        </div>
        <div id="transcriptNotice" class="notice hidden" style="margin-top: 0.75rem;"></div>
      </div>
      <div class="card hidden" id="summaryCard">
        <div class="card-label">Summary</div>
        <div class="summary-box" id="summaryBox"></div>
      </div>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
